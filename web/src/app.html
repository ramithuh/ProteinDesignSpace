<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description" content="denovo.run — browser-native WebGPU workbench for de novo protein design, inverse folding, and structure prediction" />
  <meta property="og:title" content="denovo.run — Browser-Native WebGPU Protein Design" />
  <meta property="og:description" content="Compose RFD4-Proteina, Genie 3, ProteinMPNN, and LocalFold (AlphaFold2, RoseTTAFold3, Boltz-2, AlphaFold 3) workflows locally in your browser." />
  <meta property="og:image" content="https://denovo.run/og-default.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="denovo.run — Browser-Native WebGPU Protein Design" />
  <meta name="twitter:description" content="Compose RFD4-Proteina, Genie 3, ProteinMPNN, and LocalFold workflows locally in your browser via WebGPU." />
  <meta name="twitter:image" content="https://denovo.run/og-default.png" />
  <script>
    (function () {
      window.__denovoPreloaderStart = performance.now();
      try {
        var t = localStorage.getItem('denovo-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    #denovo-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0b0c10;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      transition: opacity 280ms ease, visibility 280ms ease;
    }
    :root[data-theme='light'] #denovo-preloader {
      background: #f5f7fb;
      color: #0f172a;
    }
    #denovo-preloader.is-done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #denovo-preloader .pl-mark {
      width: 84px;
      height: 84px;
      filter: drop-shadow(0 10px 26px rgba(37, 99, 235, 0.26));
    }
    #denovo-preloader .pl-ribbon {
      stroke-dasharray: 36;
      stroke-dashoffset: 36;
      animation: pl-draw 0.85s ease-in-out infinite alternate;
    }
    #denovo-preloader .pl-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: pl-pulse 0.85s ease-in-out infinite;
    }
    #denovo-preloader .pl-dot-2 { animation-delay: 140ms; }
    #denovo-preloader .pl-dot-3 { animation-delay: 280ms; }
    #denovo-preloader .pl-word {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    #denovo-preloader .pl-accent {
      color: #60a5fa;
    }
    :root[data-theme='light'] #denovo-preloader .pl-accent {
      color: #2563eb;
    }
    @keyframes pl-draw {
      0% { stroke-dashoffset: 36; opacity: 0.55; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes pl-pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1.12); }
    }
    @media (prefers-reduced-motion: reduce) {
      #denovo-preloader .pl-ribbon { stroke-dashoffset: 0; animation: none; }
      #denovo-preloader .pl-dot { animation: none; }
    }
  </style>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div id="denovo-preloader" aria-label="Loading denovo.run" role="status">
    <svg class="pl-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#0f172a"/>
      <path class="pl-ribbon" d="M8 22 C11 10, 15 10, 16 16 C17 22, 21 22, 24 10" fill="none" stroke="#60a5fa" stroke-width="2.8" stroke-linecap="round"/>
      <circle class="pl-dot pl-dot-1" cx="8" cy="22" r="2.6" fill="#38bdf8"/>
      <circle class="pl-dot pl-dot-2" cx="16" cy="16" r="2.6" fill="#a78bfa"/>
      <circle class="pl-dot pl-dot-3" cx="24" cy="10" r="2.6" fill="#34d399"/>
    </svg>
    <div class="pl-word"><span class="pl-accent">denovo</span>.run</div>
  </div>
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
